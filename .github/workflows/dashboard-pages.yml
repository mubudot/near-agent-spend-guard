name: Dashboard Pages (manual publication)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the static dashboard
        run: |
          mkdir -p .tmp/dashboard-pages
          cp web/index.html web/styles.css .tmp/dashboard-pages/
          cp -R web/src .tmp/dashboard-pages/src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp/dashboard-pages
  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
