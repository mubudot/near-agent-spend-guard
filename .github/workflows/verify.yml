name: Verify contract and dashboard

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain and WASM target
        run: rustup show
      - name: Verify all stages (skips fail)
        run: |
          test "$(uname -m)" = x86_64
          node scripts/verify.mjs --ci
      - name: Retain commit-scoped verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: .tmp/verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
