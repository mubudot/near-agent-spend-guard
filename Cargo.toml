[package]
name = "near-agent-spend-guard"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.17.2"
borsh = "1.5"

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = true
